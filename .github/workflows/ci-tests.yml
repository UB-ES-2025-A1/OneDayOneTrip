name: ✅ CI Tests (PR -> staging)

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Pytest (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # usa la misma versión que en local

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 🔧 Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/api
        run: |
          pytest -q

  frontend-tests:
    name: Vitest (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install deps
        run: npm ci

      - name: 🧪 Run vitest
        env:
          CI: "true"
        run: |
          npm test -- --run
