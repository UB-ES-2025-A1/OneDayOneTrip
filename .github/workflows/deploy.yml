name: 🚀 Deploy API (Render) & Frontend (Netlify)

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to Render & Netlify
    runs-on: ubuntu-latest
    environment: production   # 👈 usa el environment 'production' de GitHub (si lo tienes creado)
    steps:
      # 1️⃣ Clonar el repositorio
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Desplegar BACKEND en Render
      - name: 🔁 Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "📡 Lanzando despliegue de FastAPI en Render..."
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "❌ ERROR: Falta el secret RENDER_DEPLOY_HOOK"
            exit 1
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK" || {
            echo "❌ Falló el deploy en Render"
            exit 1
          }
          echo "✅ Render deploy trigger enviado correctamente."

      # 3️⃣ Configurar Node.js y construir el FRONTEND
      - name: ⚙️ Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build

      # 4️⃣ Desplegar FRONTEND en Netlify
      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: ./frontend/dist
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "🚀 Deploy automático desde GitHub Actions (production)"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
