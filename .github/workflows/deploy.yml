name: 🚀 Deploy API (Render) & Frontend (Netlify)

on:
  push:
    branches:
      - production   # 👈 solo al hacer merge o push real a production

jobs:
  deploy:
    name: Deploy to Render & Netlify
    runs-on: ubuntu-latest
    environment: production   # 👈 usa el entorno 'production' para los secrets

    steps:
      # 1️⃣ Clona el repositorio
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Despliega el BACKEND en Render
      - name: 🔁 Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "📡 Lanzando despliegue de FastAPI en Render..."
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "❌ ERROR: Falta el secret RENDER_DEPLOY_HOOK"
            exit 1
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK" || {
            echo "❌ Error al lanzar el deploy en Render"
            exit 1
          }
          echo "✅ Render deploy trigger enviado correctamente."

      # 3️⃣ Trigger de deploy en Netlify (sin build)
      - name: 🚀 Trigger Netlify deploy
        uses: nwtgck/actions-netlify@v2
        with:
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "🚀 Deploy automático (production)"
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
