name: 🧪 CI – Backend & Frontend Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  backend-tests:
    name: Run backend tests
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona el repositorio
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Instala Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Instala dependencias del backend
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov

      # 4️⃣ Ejecuta los tests con coverage
      - name: 🧪 Run pytest with coverage
        env:
            FIREBASE_CREDENTIALS: "{}"
            MONGO_URI: ""
            IMGBB_API_KEY: ""
            PYTHONPATH: api
        run: |
          pytest --cov=app --cov-report=json --cov-report=term -q api/tests

      # 5️⃣ Upload backend coverage data
      - name: 📤 Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.json
          retention-days: 1

  frontend-tests:
    name: Run frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 🧪 Run frontend tests with coverage
        env:
          CI: "true"
        run: |
          npm run test:cov -- --reporter=dot

      # Upload frontend coverage summary (vitest coverage is in coverage/ folder)
      - name: 📤 Upload frontend coverage summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-summary
          path: frontend/coverage/
          retention-days: 1

  generate-coverage-docs:
    name: Generate coverage documentation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov

      # Download coverage artifacts
      - name: 📥 Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: .

      # 6️⃣ Genera documentación de coverage
      - name: 📝 Generate coverage documentation
        env:
            PYTHONPATH: api
        run: |
          python scripts/generate_coverage_docs.py

      # 7️⃣ Upload coverage docs as artifact
      - name: 📤 Upload coverage documentation
        uses: actions/upload-artifact@v4
        with:
          name: coverage-docs
          path: |
            docs/TEST_COVERAGE.md
            docs/TEST_COVERAGE_SUMMARY.md
          retention-days: 30

      # 8️⃣ Create PR comment with coverage summary
      - name: 💬 Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let comment = '## 📊 Test Coverage Summary\n\n';
            try {
              if (fs.existsSync('docs/TEST_COVERAGE_SUMMARY.md')) {
                const summary = fs.readFileSync('docs/TEST_COVERAGE_SUMMARY.md', 'utf8');
                // Extract key metrics
                const backendMatch = summary.match(/Backend: (\d+)%/);
                const frontendMatch = summary.match(/Frontend: (\d+)%/);
                if (backendMatch) comment += `**Backend Coverage**: ${backendMatch[1]}%\n\n`;
                if (frontendMatch) comment += `**Frontend Coverage**: ${frontendMatch[1]}%\n\n`;
                comment += '📄 Full coverage report available in artifacts.\n';
              } else {
                comment += 'Coverage documentation generated. Check artifacts for details.';
              }
            } catch (e) {
              comment += 'Coverage data collected. Check artifacts for full report.';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
