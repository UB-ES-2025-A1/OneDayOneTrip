name: 🧪 CI – Backend & Frontend Tests

on:
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona el repositorio
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Instala Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # o la versión que uses para FastAPI

      # 3️⃣ Instala dependencias del backend
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest

      # 4️⃣ Ejecuta los tests
      - name: 🧪 Run pytest
        env:
            FIREBASE_CREDENTIALS: "{}"
            MONGO_URI: ""
            IMGBB_API_KEY: ""
        run: |
          pytest -v tests

  frontend-tests:
    name: ⚛️ React / Vitest tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 🧪 Run frontend tests (auto-detect)
        env:
          CI: "true"
        run: |
          node -p "require('./package.json').scripts" || true
          if npm run | grep -q "test:run"; then
            npm run test:run -- --reporter=dot
          elif npm run | grep -q "test:cov"; then
            npm run test:cov -- --reporter=dot
          elif npm run | grep -q "^  test$"; then
            npm test -- --reporter=dot
          else
            npx vitest run --reporter=dot
          fi