name: 🛡️ Validacio de Qualitat (CI)

# ----------------------------------------------------
# 1. QUAN ACTÚA (Triggers)
# ----------------------------------------------------
on:
  push:
    # Actua en cada push a staging i a la teva branca de treball
    branches: [ staging, setup-linting ]
  pull_request:
    # Actua en PRs dirigits a staging (i a la teva branca per si de cas)
    branches: [ staging, setup-linting ]

jobs:
  # ==============================
  # TASCA 1: VALIDACIÓ DEL FRONTEND (Node/TS)
  # ==============================
  frontend_lint:
    name: Frontend (Node/TS)
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout Repositori
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instal·lar Dependències (Frontend)
        # Només instal·lem al subdirectori frontend/
        run: npm install
        working-directory: ./frontend/

      - name: Executar Linting (ESLint)
        run: npm run lint
        working-directory: ./frontend/

  # ==============================
  # TASCA 2: VALIDACIÓ DEL BACKEND (Python)
  # ==============================
  backend_lint:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout Repositori
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar Linters
        run: pip install flake8 black

      - name: Executar Flake8 (Linting)
        # SOLUCIÓ BYPASS: Ignora E501 (línia llarga) i E203/W503 (estil)
        # perquè Black ja ho ha arreglat localment a 88 caràcters.
        run: flake8 ./api/ --ignore=E501,E203,W503

      - name: Executar Black (Comprovar Format)
        run: black ./api/ --check