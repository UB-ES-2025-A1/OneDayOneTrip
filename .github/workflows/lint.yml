name: 🛡️ Validacion de Calidad (CI)

# ----------------------------------------------------
# 1. CUÁNDO ACTÚA (Triggers)
# ----------------------------------------------------
on:
  push:
    # Actúa cuando se hace un 'push' directo a la rama 'staging'.
    # NOTA: Esto solo debe ocurrir si el desarrollador omitió un PR.
    branches: [ staging ]
  pull_request:
    # Actúa cuando se abre o se actualiza (con un nuevo push) un PR
    # cuyo destino es la rama 'staging'.
    branches: [ staging ]

# ----------------------------------------------------
# 2. TRABAJOS A EJECUTAR (Jobs)
# ----------------------------------------------------
jobs:
  # TRABAJO 1: LINTING Y PRUEBAS DEL FRONTEND
  frontend_lint:
    name: Frontend (Node/TS)
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout Repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajusta a la versión de Node que uses

      - name: Instalar Dependencias (Raíz)
        # Instala las dependencias globales como 'lint-staged'
        run: npm install

      - name: Instalar Dependencias (Frontend)
        run: npm install
        working-directory: ./frontend/

      - name: Ejecutar Linting (ESLint)
        # Ejecuta el script 'lint' definido en el package.json del frontend
        run: npm run lint
        working-directory: ./frontend/

    # - name: Ejecutar Pruebas
    #   run: npm test
    #   working-directory: ./frontend/

  # TRABAJO 2: LINTING DEL BACKEND
  backend_lint:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Ajusta a la versión de Python que uses

      - name: Instalar Linters
        # Instala las herramientas de calidad requeridas
        run: pip install flake8 black

      - name: Ejecutar Flake8 (Linting)
        # Flake8 busca errores de estilo y sintaxis
        run: flake8 ./api/

      - name: Ejecutar Black (Comprobar Formato)
        # Black con --check falla si encuentra código sin formatear
        run: black ./api/ --check