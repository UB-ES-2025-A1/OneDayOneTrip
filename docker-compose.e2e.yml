# Docker Compose para tests E2E con base de datos real
# Levanta MongoDB y el backend API para pruebas de integración

services:
  # MongoDB para tests E2E
  mongo-e2e:
    image: mongo:7.0
    container_name: onedayonetrip-mongo-e2e
    ports:
      - "27018:27017"  # Puerto diferente para no colisionar con desarrollo
    environment:
      MONGO_INITDB_DATABASE: OneDayOneTrip_E2E
    volumes:
      - mongo-e2e-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - e2e-network

  # Backend API para tests E2E  
  api-e2e:
    build:
      context: ./api
      dockerfile: Dockerfile.e2e
    container_name: onedayonetrip-api-e2e
    ports:
      - "8000:8000"  # Mismo puerto que espera el frontend (127.0.0.1:8000)
    environment:
      - MONGO_URI=mongodb://mongo-e2e:27017/OneDayOneTrip_E2E
      # Credenciales del servicio de Firebase (JSON en una sola línea).
      # Defínelo en el .env de la raíz como:
      # FIREBASE_CREDENTIALS_E2E={"type":"service_account",...}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS_E2E}
      - E2E_MODE=true
    depends_on:
      mongo-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - e2e-network

volumes:
  mongo-e2e-data:

networks:
  e2e-network:
    driver: bridge


